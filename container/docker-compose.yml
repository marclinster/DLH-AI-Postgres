services:
  db:
    build: .
    image: dlh-ai-postgres:18.7
    container_name: pg18
    ports:
      - "5432:5432"
    restart: unless-stopped
    shm_size: "512mb"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "postgres"
    # API keys (e.g. MISTRAL_API_KEY) live in secrets.env, which is not committed.
    # Copy secrets.env.example to secrets.env and fill in your keys.
    env_file:
      - path: secrets.env
        required: false
    volumes:
      - pg_18_dlh:/var/lib/postgresql

volumes:
  pg_18_dlh:
    name: pg_18_dlh