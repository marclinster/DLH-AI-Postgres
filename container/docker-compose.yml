services:
  db:
    build: .
    image: dlh-ai-postgres:18.6
    container_name: pg18
    ports:
      - "5432:5432"
    restart: unless-stopped
    shm_size: "512mb"
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "postgres"
    volumes:
      - pg_data:/var/lib/postgresql

volumes:
  pg_data:
